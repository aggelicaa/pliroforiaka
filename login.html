<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Astrobulk ERP | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-box">
            <h2 class="login-logo-text">Astrobulk Ltd</h2>
            <p class="login-subtext">Internal Access Only</p>
            
            <form action="index.html" method="GET">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required placeholder="Όνομα χρήστη">
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required placeholder="Κωδικός πρόσβασης">
                </div>

                <button type="submit" class="login-submit-btn">Είσοδος στο Σύστημα</button>
            </form>
        </div>
    </div>

</body>
</html>
